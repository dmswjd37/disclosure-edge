[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disclosure-edge"
version = "0.1.0"
description = "DART disclosure monitoring and automated trading notification service."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27,<1.0",
    "nhplug[tls]>=1.0",
    "python-dotenv>=1.0",
    "truststore>=0.9",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
